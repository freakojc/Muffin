name: Portable Probe (temporary, no tag / no release)

# Throwaway branch used only to produce a Windows x64 *portable* package from
# the merged Lengyi theme + locked-editing branches. Pushing this branch builds
# and uploads a single artifact; no tag is created and no GitHub Release is
# published. Delete the branch when the build has been collected.

on:
  push:
    branches:
      - ci/portable-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Windows x64 portable
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python tools
        run: python -m pip install --upgrade conan PySide6==6.10.2 -r requirements-build.txt

      - name: Restore Conan packages
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2/p
          key: conan-pkg-${{ runner.os }}-x86_64-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-pkg-${{ runner.os }}-x86_64-

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Install dependencies
        run: conan install . -s build_type=Release -s compiler.cppstd=20 -s arch=x86_64 --build=missing

      - name: Configure
        shell: bash
        run: cmake --preset conan-default -DMUFFIN_VERSION_OVERRIDE=0.7.6

      - name: Build
        run: cmake --build --preset conan-release

      - name: Build distribution
        run: cmake --build --preset conan-release --target dist

      - name: Smoke test distribution
        shell: pwsh
        continue-on-error: true
        run: build/dist/Muffin.exe --version

      # Validates the merged branches on the real MSVC build: the Lengyi theme
      # tokens (embedded fonts, 92% column, table metrics), the code-surface
      # palette fix and the locked-editing changes must compile and pass ctest.
      # A red test does not block the portable package: this build exists to be
      # looked at, and the result is collected from the log.
      - name: Test
        continue-on-error: true
        run: ctest --preset conan-release --output-on-failure

      - name: Prune Conan cache
        run: conan cache clean --source --build --download

      - name: Save Conan packages
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2/p
          key: conan-pkg-${{ runner.os }}-x86_64-${{ hashFiles('conanfile.py') }}
        continue-on-error: true

      - name: Archive portable package
        shell: pwsh
        run: |
          $archive = "Muffin-0.7.6-probe-windows-x64-portable.7z"
          & "$env:ProgramFiles/7-Zip/7z.exe" a -t7z $archive "./build/dist/*" -m0=LZMA2 -mx=9 -md=64m -ms=on -mmt=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:ProgramFiles/7-Zip/7z.exe" t $archive

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muffin-0.7.6-probe-windows-x64-portable
          path: Muffin-0.7.6-probe-windows-x64-portable.7z
          if-no-files-found: error
          retention-days: 30
